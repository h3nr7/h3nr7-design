<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Dialog — preview</title>
<style>body { padding: 20px 24px; } body { position: relative; min-height: 190px; }</style>
</head>
<body>
<div class="h3-prose" style="max-width:40rem"><p>The page behind stays legible but recedes: the scrim washes it toward the paper rather than darkening it. Body copy continues underneath the dialog.</p><p>Second paragraph of the page behind the scrim.</p></div>
<div class="h3-scrim" style="position:absolute;z-index:1"></div>
<div class="h3-dialog" role="dialog" aria-label="Example" style="position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:22rem">
  <p style="margin-bottom:12px">Drop me a line and I will get back to you this week.</p>
  <button class="h3-button" type="button">Close</button>
</div>

</body>
</html>
